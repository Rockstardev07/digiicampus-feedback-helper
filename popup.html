<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Helper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #202124;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #1565c0;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }
    .badge {
      font-size: 11.5px;
      padding: 6px 10px;
      background: #e8eaed;
      border-radius: 6px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge.has-data {
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 500;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 12px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #1976d2;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: #1565c0;
    }
    .btn-success {
      background: #2e7d32;
      color: #fff;
    }
    .btn-success:hover:not(:disabled) {
      background: #1b5e20;
    }
    .btn-outline {
      background: #fff;
      color: #555;
      border: 1px solid #dadce0;
    }
    .btn-outline:hover:not(:disabled) {
      background: #f1f3f4;
    }
    .log {
      font-size: 11.5px;
      color: #666;
      min-height: 18px;
    }
    .log.running {
      color: #1976d2;
      font-weight: 500;
    }
    .log.success {
      color: #2e7d32;
      font-weight: 600;
    }
    .log.error {
      color: #c62828;
      font-weight: 600;
    }
    .tip {
      font-size: 10.5px;
      color: #777;
      line-height: 1.35;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>📋</span> DigiiCampus Feedback Helper
  </div>

  <div class="badge" id="popup-badge">
    <span>⚪</span> No feedback copied yet
  </div>

  <button class="btn btn-primary" id="btn-copy">
    <span>📋</span> Step 1: Copy All Sections
  </button>

  <button class="btn btn-success" id="btn-paste">
    <span>⚡</span> Step 2: Fill Both Sections & Submit
  </button>

  <button class="btn btn-outline" id="btn-excellent">
    <span>⭐</span> Quick Fill All Excellent & Submit
  </button>

  <div class="log" id="popup-log">Ready</div>

  <div class="tip">
    💡 <strong>Tip:</strong> The extension guarantees both Section 1 & Section 2 are 100% completed with green checkmarks before clicking Submit!
  </div>

  <script src="popup.js"></script>
</body>
</html>
